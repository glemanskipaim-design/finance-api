# ---------- Banco ----------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/financeiro
%dev.quarkus.hibernate-orm.log.sql=true
# As tabelas vêm de database/financeiro.sql (o docker-compose roda o script).
quarkus.hibernate-orm.schema-management.strategy=none
# Testes: banco separado "financeiro_teste"; o Hibernate recria as tabelas a cada execução.
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/financeiro_teste
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ---------- REST ----------
# Todos os endpoints ficam em /api/... (o Angular encaminha /api para cá).
quarkus.rest.path=/api

# ---------- Autenticação: JWT dentro de um cookie httpOnly ----------
# O Quarkus lê o token do cookie "finance_token" e valida a assinatura em cada requisição.
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=finance_token
mp.jwt.verify.issuer=finance-api
app.jwt.duracao-minutos=120
app.cookie.secure=false
# Em dev/test o Quarkus gera sozinho as chaves RSA que assinam o token.
